tools:
- name: list_leagues
  title: List leagues
  description: All 90+ leagues on football-charts.com with country, league key and the seasons available
    to your key (newest first). Call this first to resolve league keys and season strings.
  required: []
  optional: []
  read_only: true
  source_operation: GET /api/v1/leagues/
- name: get_league_table
  title: League table
  description: 'Current standings for a league season: position, points, W/D/L, goals, goal difference,
    last-5 form.'
  required:
  - league
  optional:
  - season
  read_only: true
  source_operation: GET /api/v1/leagues/{league}/table/
- name: get_rankings
  title: Alternative rankings
  description: 'The table re-ranked by FC''s alternative views: ''luck'' (luck-adjusted) or ''goals''
    (highest-scoring matches).'
  required:
  - league
  - view
  optional:
  - season
  read_only: true
  source_operation: GET /api/v1/leagues/{league}/table/?view=luck|goals
- name: get_results
  title: Match results
  description: Finished matches of a league season with FT/HT scores and first-goal minute, oldest first.
  required:
  - league
  optional:
  - season
  - team
  - last
  read_only: true
  source_operation: GET /api/v1/leagues/{league}/results/
- name: get_fixtures
  title: Upcoming fixtures
  required:
  - league
  optional: []
  read_only: true
  source_operation: GET /api/v1/leagues/{league}/fixtures/
- name: get_match
  title: Match detail
  required:
  - slug
  optional: []
  read_only: true
  source_operation: GET /api/v1/matches/{slug}/
- name: get_season_projection
  title: Season projection
  description: Title / top-4 / relegation %, points ranges (10k Monte Carlo sims, daily).
  required:
  - league
  optional: []
  read_only: true
  source_operation: GET /api/v1/leagues/{league}/projection/
- name: get_team
  title: Team page
  required:
  - league
  - team
  optional:
  - season
  read_only: true
  source_operation: GET /api/v1/leagues/{league}/teams/{team}/
- name: get_goal_timing
  title: Goal timing heat map
  required:
  - league
  optional:
  - season
  read_only: true
  source_operation: GET /api/v1/leagues/{league}/goal-timing/
- name: get_track_record
  title: Model track record
  description: FC's settled public prediction ledger.
  required: []
  optional:
  - days
  read_only: true
  source_operation: GET /api/v1/track-record/
