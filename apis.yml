apis:
  - name: Football Charts REST API
    description: >-
      Free read-only REST API for football statistics, standings, results, fixtures, match probabilities, season
      projections, goal timing, and prediction track record. Bearer API key auth (or X-API-Key) with a self-describing
      JSON descriptor at the root. Ten GET operations plus self-serve key registration; 5,000 requests/day and 60/minute
      on the free tier.
    image: https://www.football-charts.com/fc_logo4.png
