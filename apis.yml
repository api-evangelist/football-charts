  - name: Football Charts MCP Server
    description: >-
      Hosted MCP server (protocol 2025-06-18) exposing ten read-only football statistics tools (list_leagues,
      get_league_table, get_rankings, get_results, get_fixtures, get_match, get_season_projection, get_team,
      get_goal_timing, get_track_record) for AI agents. tools/list answers anonymously; tool calls take the API key
      embedded in the URL path or via an Authorization header on POST /mcp. Also runnable locally as
      npx -y footballcharts-mcp.
