name: Football Charts
description: >-
  Transparent football (soccer) statistics and model predictions across 90+ leagues: league tables (classic,
  luck-adjusted, goals-based), results, fixtures with model probabilities, Dixon-Coles match probabilities, Monte Carlo
  season projections, goal-timing distributions, team match logs, and a public prediction track record. A single
  Dixon-Coles scoreline model produces one joint distribution per match, so 1X2, over/under and BTTS probabilities are
  mutually consistent by construction; season outcomes come from 10,000-run Monte Carlo simulations re-run daily. Every
  model signal is logged before kickoff and settled publicly. Offers a free read-only REST API with a self-describing
  JSON descriptor and a hosted MCP server whose tools/list is answerable anonymously.
