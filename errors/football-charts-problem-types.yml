generated: '2026-09-04'
method: probed
source: >-
  live unauthenticated requests to https://footballcharts-backend.onrender.com/api/v1/*, plus the
  error handling in the provider's own MCP client
  (https://github.com/ddevetak/footballcharts-mcp/blob/main/src/fc.js)
format: custom-json
rfc9457: false
envelope:
  content_type: application/json
  shape: '{"error": {"code": "<snake_case>", "message": "<human readable>"}}'
  fields:
    - {name: error.code, type: string, note: 'stable machine-readable slug'}
    - {name: error.message, type: string, note: 'human-readable, often carries the remediation inline'}
note: >-
  Football Charts publishes no OpenAPI and no docs error reference, so this catalog is OBSERVED, not
  derived from a spec and not enumerated by the provider. Only the codes actually returned to us are
  listed; the list is therefore a floor, not a complete registry. The provider's own MCP client
  treats any non-2xx by surfacing error.message verbatim, falling back to
  "football-charts API error <status> (<code>)".
