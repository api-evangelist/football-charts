schemes:
  - name: bearerApiKey
    type: apiKey
    in: header
    parameter: Authorization
    format: 'Bearer fc_<key>'
    surfaces: [rest, mcp-remote]
    sources: ['https://www.football-charts.com/developers', 'live 401 body']
  - name: xApiKey
    type: apiKey
    in: header
    parameter: X-API-Key
